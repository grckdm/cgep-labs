# .github/workflows/gcp-wif-demo.yml
name: gcp-wif-demo

on:
  workflow_dispatch:

permissions:
  id-token: write   # required to mint the OIDC token
  contents: read

jobs:
  gcp-wif-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          # terraform output -raw workload_identity_provider (terraform/baselines/gcp)
          workload_identity_provider: projects/96301664384/locations/global/workloadIdentityPools/github-actions/providers/github
          # terraform output -raw wif_service_account_email
          service_account: cgep-grc-gate-sa@cgep-lab-5-4.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Prove no key on disk, then call the API with the minted token
        run: |
          echo "No GOOGLE_APPLICATION_CREDENTIALS key file — auth used a short-lived OIDC-derived token:"
          env | grep -i GOOGLE_APPLICATION_CREDENTIALS || echo "(unset, as expected)"
          gcloud auth list
          gcloud storage ls --project=cgep-lab-5-4
